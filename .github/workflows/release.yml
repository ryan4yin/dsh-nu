name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Nushell
        uses: hustcer/setup-nu@95cd3bfe252450ef7d35dd9a7ddecf3484341134
        with:
          version: '0.115.1'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install and link dsh peers
        run: |
          npm install --no-save --ignore-scripts @deepseek-ai/dsh@0.2.1-rc.2
          node dev/link-peers.mjs --root .

      - name: Check the tag matches the manifest
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "${GITHUB_REF_NAME}"

      - name: Typecheck, build, test, probe
        env:
          DSH_INTEGRATION_CLI: ${{ github.workspace }}/node_modules/.bin/dsh
        run: |
          npm run typecheck
          npm run build
          npm test
          npm run probe

      - name: Pack
        run: npm pack

      # Trusted publishing: no npm token is stored in this repository. The
      # package's npm settings authorize this repository and workflow, and the
      # runner exchanges its GitHub OIDC identity for a short-lived publish
      # token. The first publish of a new package name cannot be configured in
      # npm package settings yet, so 0.1.0 is published once manually; every
      # later tag uses this job.
      - name: Check whether this version is already published
        id: published
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "dsh-nu@${version}" version >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Stage for the npm release
        if: steps.published.outputs.exists == 'false'
        run: npm stage publish --provenance --access public

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists"
          else
            gh release create "${GITHUB_REF_NAME}" ./*.tgz --repo "${GITHUB_REPOSITORY}" --generate-notes --title "${GITHUB_REF_NAME}"
          fi
