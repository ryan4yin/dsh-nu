name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Nushell
        uses: hustcer/setup-nu@95cd3bfe252450ef7d35dd9a7ddecf3484341134
        with:
          version: '0.115.1'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install and link dsh peers
        run: |
          npm install --no-save --ignore-scripts @deepseek-ai/dsh@0.2.1-rc.2
          node dev/link-peers.mjs --root .

      - name: Check the tag matches the manifest
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "${GITHUB_REF_NAME}"

      - name: Typecheck, build, test, probe
        env:
          DSH_INTEGRATION_CLI: ${{ github.workspace }}/node_modules/.bin/dsh
        run: |
          npm run typecheck
          npm run build
          npm test
          npm run probe

      - name: Pack
        run: npm pack

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" ./*.tgz --repo "${GITHUB_REPOSITORY}" --generate-notes --title "${GITHUB_REF_NAME}"
