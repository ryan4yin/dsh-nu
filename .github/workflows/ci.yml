name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changed.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: hustcer/setup-nu@95cd3bfe252450ef7d35dd9a7ddecf3484341134 # v3.28
        with:
          version: 0.115.1
      - id: changed
        name: Decide whether code changed
        shell: nu {0}
        run: |
          if $env.GITHUB_EVENT_NAME != 'pull_request' {
            'code=true' | save --append $env.GITHUB_OUTPUT
            exit 0
          }
          let base = 'origin/' + $env.GITHUB_BASE_REF
          ^git fetch --no-tags origin $env.GITHUB_BASE_REF
          let files = (^git diff --name-only $'($base)...HEAD' | lines | where { |line| $line != '' })
          let patterns = [
            '^src/'
            '^test/'
            '^dev/'
            '^package\.json$'
            '^package-lock\.json$'
            '^tsconfig[^/]*\.json$'
            '^cordis\.patch\.yml$'
            '^\.github/workflows/'
          ]
          let code = ($files | any { |file| $patterns | any { |pattern| $file =~ $pattern } })
          $'code=($code)' | save --append $env.GITHUB_OUTPUT

  docs:
    name: docs
    needs: changes
    if: needs.changes.outputs.code != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Documentation tests
        run: node --import tsx --test test/docs.test.ts

  test:
    name: test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: hustcer/setup-nu@95cd3bfe252450ef7d35dd9a7ddecf3484341134 # v3.28
        with:
          version: 0.115.1
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install and link dsh peers
        run: |
          npm install --no-save --ignore-scripts @deepseek-ai/dsh@0.2.1-rc.2
          node dev/link-peers.mjs --root .
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Integration boot
        if: runner.os == 'Linux'
        run: npm run test:integration
      - name: Check the published file list
        run: npm pack --dry-run
