name: CI

on:
  pull_request:
    paths-ignore:
      # User-facing docs are covered by the Docs workflow. Do not ignore
      # `**/*.md`: `src/guides/*.md` are prompt inputs that `npm test` and the
      # integration boot verify.
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'AGENTS.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nix:
    name: nix package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
      - name: Build the plugin
        run: nix build --print-out-paths .#checks.x86_64-linux.package

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: hustcer/setup-nu@95cd3bfe252450ef7d35dd9a7ddecf3484341134 # v3.28
        with:
          version: 0.115.1
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install and link dsh peers
        run: |
          npm install --no-save --ignore-scripts @deepseek-ai/dsh@0.2.1-rc.2
          node dev/link-peers.mjs --root .
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Integration boot
        if: runner.os == 'Linux'
        run: npm run test:integration
      - name: Check the published file list
        run: npm pack --dry-run
