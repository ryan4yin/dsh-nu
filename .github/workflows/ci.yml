name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changed.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        name: Decide whether code changed
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "${{ github.base_ref }}"
          code=false
          while IFS= read -r file; do
            case "$file" in
              src/*|test/*|dev/*|package.json|package-lock.json|tsconfig*.json|cordis.patch.yml|.github/workflows/*)
                code=true
                break
                ;;
            esac
          done <<< "$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  docs:
    name: docs
    needs: changes
    if: needs.changes.outputs.code != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Documentation tests
        run: node --import tsx --test test/docs.test.ts

  test:
    name: test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: hustcer/setup-nu@95cd3bfe252450ef7d35dd9a7ddecf3484341134 # v3.28
        with:
          version: 0.115.1
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install and link dsh peers
        run: |
          npm install --no-save --ignore-scripts @deepseek-ai/dsh@0.2.1-rc.2
          node dev/link-peers.mjs --root .
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Integration boot
        if: runner.os == 'Linux'
        run: npm run test:integration
      - name: Check the published file list
        run: npm pack --dry-run
