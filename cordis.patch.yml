# The dsh-nu bundle patch.
#
# dsh-base mounts the platform shell executor row (bash on POSIX, pwsh on
# Windows) and the matching shell tool row. This bundle disables both executor
# rows and inserts one Nushell executor instead, then mounts the teaching layer.
# DSH alpha owns model-facing schemas in its tool executor, so the native
# executor is replaced by a variant that rewrites the bash/pwsh descriptions.
#
# The shell tool rows stay enabled: they call ctx.shell and the tool name the
# model sees stays "bash"/"pwsh", which keeps prompts and saved sessions stable.
#
# The sandbox is not part of this bundle: dsh-sandbox-local and
# dsh-sandbox-policy stay mounted, and the Nu executor below extends the
# platform sandbox executor, so confinement and denial reporting are unchanged.

- id: tool-executor-native
  disabled: true

- id: bash-sandbox
  disabled: true

- id: pwsh-sandbox
  disabled: true

- insert:
    - id: nu-native-tool-executor
      name: dsh-nu/native-executor

    - id: nu-executor
      name: dsh-nu/executor
      config:
        nuPath: !!js process.env.DSH_NU_PATH ?? ''
        # dsh-base set 60000 on the platform executor row this bundle disables;
        # restate it here so the shell tool keeps the same default timeout.
        timeoutMs: 60000
        enforceNushellOnly: true
        syntaxLint: true
        syntaxHints: true
        requireNu: true
        verifyNu: true

    - id: nu-teaching
      name: dsh-nu/teaching
      config:
        guide: full
        rules: true
        rewriteToolDescriptions: true
